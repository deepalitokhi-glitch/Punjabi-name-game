<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjabi Name Place Animal Thing Game</title>
<style>
  body{font-family:system-ui; background:#FFF7ED; display:flex; justify-content:center; padding:20px; margin:0}
  .card{background:white; width:100%; max-width:400px; padding:20px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.1); text-align:center}
  #letter{font-size:80px; font-weight:900; color:#FF6B00; margin:10px 0; line-height:1}
  .score{font-weight:bold; color:green}
  input{width:100%; padding:12px; margin:8px 0; border-radius:10px; border:2px solid #FFE0B2; font-size:16px; outline:none; box-sizing:border-box}
  input:focus{border-color:#FF6B00}
  button{width:100%; padding:14px; background:#FF6B00; color:white; border:none; border-radius:12px; font-size:18px; font-weight:bold; margin-top:10px; cursor:pointer}
  button:active{transform:scale(0.98)}
  #msg{height:24px; margin-top:10px; font-weight:bold; font-size:15px}
  .hint{font-size:12px; color:#888; margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div style="display:flex; justify-content:space-between;"><span>Letter: <b id="curLetter">B</b></span> <span class="score">Score: <span id="score">10</span>/260</span></div>
  <div id="letter">B</div>
  <input id="name" placeholder="Name - Jaise Barkha">
  <input id="place" placeholder="Place - Jaise Bathinda">
  <input id="animal" placeholder="Animal - Jaise Bear">
  <input id="thing" placeholder="Thing - Jaise Bottle">
  <button onclick="checkAns()">CHECK & NEXT ➡️</button>
  <div id="msg"></div>
  <div class="hint">Real words likho, aad/aaa jaisa gibberish block hoga</div>
</div>

<script>
let letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
let curIndex=1; // B se start
let score=10;
let gibberish = ["aaa","aad","abc","abcd","asdf","qwerty","xyz","zzzz","aaaa","bbb","ccc","ddd","asd","efg","xxx"];

function isValid(word){
  if(word.length < 3) return "3 akshar se kam nahi chalega!";
  if(!/^[a-z ]+$/.test(word)) return "Sirf letters likho!";
  if(gibberish.includes(word)) return `"${word}" real word nahi hai!`;
  if(/(.)\1\1/.test(word)) return `"${word}" me same letter 3 baar hai!`;
  if(word.split('').every(c => c === word[0])) return "Sab same letter nahi!";
  return true;
}

function checkAns(){
  let L = letters[curIndex].toLowerCase();
  let n = document.getElementById("name").value.trim().toLowerCase();
  let p = document.getElementById("place").value.trim().toLowerCase();
  let a = document.getElementById("animal").value.trim().toLowerCase();
  let t = document.getElementById("thing").value.trim().toLowerCase();
  let msg = document.getElementById("msg");

  if(!n || !p || !a || !t){ msg.innerHTML="❌ Saare 4 bharo!"; msg.style.color="red"; return; }
  if(n[0]!=L || p[0]!=L || a[0]!=L || t[0]!=L){ msg.innerHTML=`❌ Sab ${L.toUpperCase()} se start hone chahiye!`; msg.style.color="red"; return; }

  let checks = [{w:n, label:"Name"}, {w:p, label:"Place"}, {w:a, label:"Animal"}, {w:t, label:"Thing"}];
  for(let obj of checks){
    let res = isValid(obj.w);
    if(res !== true){ msg.innerHTML=`❌ ${obj.label}: ${res}`; msg.style.color="red"; return; }
  }

  score+=10; 
  document.getElementById("score").innerText=score; 
  msg.innerHTML="✅ Shabaash! +10"; 
  msg.style.color="green"; 
  setTimeout(nextLetter, 600);
}

function nextLetter(){
  curIndex++; 
  if(curIndex>=26){ 
    alert("Game Khatam! Final Score: "+score+"/260"); 
    curIndex=0; score=0; 
    document.getElementById("score").innerText=0; 
  }
  document.getElementById("letter").innerText=letters[curIndex]; 
  document.getElementById("curLetter").innerText=letters[curIndex];
  ["name","place","animal","thing"].forEach(id=>document.getElementById(id).value=""); 
  document.getElementById("msg").innerText="";
}
</script>
</body>
</html>
