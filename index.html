<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punjabi Name Place Animal Thing Game</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1905215538239803" crossorigin="anonymous"></script>
<style>
body{font-family:Arial;background:#FFF3E0;text-align:center;padding:15px;margin:0}
.top-bar{background:white;padding:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 5px #ccc;position:sticky;top:0;z-index:100}
.top-bar a{background:#eee;padding:8px 15px;border-radius:20px;text-decoration:none;color:#333;font-weight:bold}
.box{background:white;max-width:400px;margin:20px auto;padding:20px;border-radius:20px;box-shadow:0 4px 10px #ccc}
input{width:90%;padding:10px;margin:8px;border:2px solid #FF9800;border-radius:10px;font-size:16px}
button{background:#FF9800;color:white;padding:12px 25px;border:none;border-radius:20px;font-weight:900;font-size:18px;cursor:pointer}
h1{color:#E65100;font-size:22px}
.letter{font-size:80px;color:#FF9800;font-weight:900;margin:10px 0}
.ad-box{background:#f9f9f9;border:1px dashed #ccc;padding:10px;margin:15px 0;border-radius:10px;min-height:90px;display:flex;align-items:center;justify-content:center;color:#999}
</style>
</head>
<body>

<div class="top-bar">
<a href="https://deepalitokhi-glitch.github.io/Amber-Toffee-Twist/">⬅ Back</a>
<span style="font-weight:900;color:#E65100">PUNJABI GAME</span>
<a href="#" onclick="location.reload()">🔄 Menu</a>
</div>

<!-- TOP AD -->
<div class="ad-box">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-1905215538239803"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div class="box">
<h1>🔤 Name Place Animal Thing</h1>
<div class="letter" id="letter">A</div>
<p>Letter <span id="letterText">A</span> se shuru hone wale shabd likho</p>
<input id="name" placeholder="Name - Jaise Arshdeep">
<input id="place" placeholder="Place - Jaise Amritsar">
<input id="animal" placeholder="Animal - Jaise Anaconda">
<input id="thing" placeholder="Thing - Jaise Apple">
<br><br>
<button onclick="check()">SUBMIT & NEXT LETTER</button>
<p id="score">Score: 0 | Letter: A / Z</p>
<p id="msg" style="color:green;font-weight:bold"></p>
</div>

<!-- BOTTOM AD -->
<div class="ad-box">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-1905215538239803"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<script>
let currentCode = 65;
let score = 0;
function check(){
 let n=document.getElementById('name').value.trim();
 let p=document.getElementById('place').value.trim();
 let a=document.getElementById('animal').value.trim();
 let t=document.getElementById('thing').value.trim();
 let letter = String.fromCharCode(currentCode);
 if(!n || !p || !a || !t){
   document.getElementById('msg').innerText="Sare 4 box bharo met!";
   return;
 }
 let ok = n[0].toUpperCase()==letter && p[0].toUpperCase()==letter && a[0].toUpperCase()==letter && t[0].toUpperCase()==letter;
 if(ok){
   score+=10;
   document.getElementById('msg').innerText="Wah met! Bilkul sahi ✅";
   currentCode++;
   if(currentCode>90){ currentCode=65; alert("Z tak complete! Fir se A se shuru! Score: "+score); }
   document.getElementById('letter').innerText=String.fromCharCode(currentCode);
   document.getElementById('letterText').innerText=String.fromCharCode(currentCode);
   document.getElementById('name').value=""; document.getElementById('place').value=""; document.getElementById('animal').value=""; document.getElementById('thing').value="";
 } else {
   document.getElementById('msg').innerText="Letter "+letter+" se hi likhna hai met! Dubara try kar";
 }
 document.getElementById('score').innerText="Score: "+score+" | Letter: "+String.fromCharCode(currentCode)+" / Z";
}
</script>
</body>
</html>
