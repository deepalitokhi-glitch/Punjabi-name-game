<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Place Animal Thing</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1905215538239803" crossorigin="anonymous"></script>
<style>body{font-family:Arial;background:#FFF3E0;text-align:center;margin:0}.top-bar{background:white;padding:10px;display:flex;justify-content:space-around;box-shadow:0 2px 5px #ccc;position:sticky;top:0}.top-bar a{background:#FF9800;color:white;padding:8px 15px;border-radius:20px;text-decoration:none;font-weight:bold;font-size:12px}.game-box{background:white;max-width:420px;margin:15px auto;padding:20px;border-radius:20px;box-shadow:0 4px 10px #ccc}input{width:92%;padding:12px;margin:7px 0;border:2px solid #FF9800;border-radius:10px;font-size:15px}button{background:#E65100;color:white;padding:12px 25px;border:none;border-radius:20px;font-weight:900;font-size:16px}#letter{font-size:70px;color:#E65100;font-weight:900}#msg{min-height:24px;font-weight:bold}</style>
</head>
<body>
<div class="top-bar"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="blog.html">Blog</a></div>
<div class="game-box">
<h2 style="color:#E65100">Name Place Animal Thing</h2>
<div id="letter">A</div>
<p>Letter: <b><span id="curLetter">A</span></b> | Score: <b><span id="score">0</span>/260</b></p>
<input id="name" placeholder="Name (e.g. Aman, Chetna)"><input id="place" placeholder="Place (e.g. Andhra Pradesh, Amritsar)"><input id="animal" placeholder="Animal (e.g. Ant, Alligator)"><input id="thing" placeholder="Thing (e.g. Apple, Aeroplane)"><br><br><button onclick="checkAns()">CHECK & NEXT</button> <button onclick="nextLetter()" style="background:#777">SKIP</button><p id="msg"></p>
<p style="font-size:11px;color:#888">Jo bhi real word hai, game accept karega</p>
</div>
<script>
let letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""); let curIndex=0; let score=0;

function checkAns(){
  let L = letters[curIndex].toLowerCase();
  let n = document.getElementById("name").value.trim().toLowerCase();
  let p = document.getElementById("place").value.trim().toLowerCase();
  let a = document.getElementById("animal").value.trim().toLowerCase();
  let t = document.getElementById("thing").value.trim().toLowerCase();
  let msg = document.getElementById("msg");

  if(!n || !p || !a || !t){ msg.innerHTML="❌ Saare 4 bharo met!"; msg.style.color="red"; return; }
  if(n[0]!=L || p[0]!=L || a[0]!=L || t[0]!=L){ msg.innerHTML=`❌ Sab ${L.toUpperCase()} se start hone chahiye!`; msg.style.color="red"; return; }
  if(n.length<2 || p.length<2 || a.length<2 || t.length<2){ msg.innerHTML="❌ Kam se kam 2 letters likho!"; msg.style.color="red"; return; }

  // SIRF BILKUL GALAT KO ROKEGA - JAISA TUNE BOLA THA
  // Animal me Car/Bus/Table nahi chalega
  let notAnimal = ["car","bus","bike","table","chair","pen","book","phone","delhi","mumbai","amritsar","andhra pradesh","aman","chetan","chetna"];
  if(notAnimal.includes(a)){ msg.innerHTML=`❌ "${a}" Animal nahi hai met!`; msg.style.color="red"; return; }

  score+=10; document.getElementById("score").innerText=score;
  msg.innerHTML="✅ Wah met! Perfect! +10"; msg.style.color="green";
  setTimeout(nextLetter, 1000);
}
function nextLetter(){
  curIndex++; if(curIndex>=26){ alert("Game Khatam! Score: "+score+"/260"); curIndex=0; score=0; document.getElementById("score").innerText=0; }
  document.getElementById("letter").innerText=letters[curIndex].toUpperCase(); document.getElementById("curLetter").innerText=letters[curIndex].toUpperCase();
  ["name","place","animal","thing"].forEach(id=>document.getElementById(id).value=""); document.getElementById("msg").innerText="";
}
</script>
</body>
</html>
